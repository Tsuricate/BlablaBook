server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

location /api/ {

  proxy_pass https://blablabook-jdbo.onrender.com;
  proxy_ssl_server_name on;
  proxy_set_header Host blablabook-jdbo.onrender.com;
  proxy_set_header X-Real-IP $remote_addr;

}
}